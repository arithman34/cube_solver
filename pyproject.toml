[project]
name = "cube-solver"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.5",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cube"]