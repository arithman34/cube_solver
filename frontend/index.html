<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/static/style.css">
    <title>Cube Solver</title>
</head>
<body>
    <header class="page-header">
        <h1>Cube Solver</h1>
        <p>Scramble a cube or paint your own, then solve it.</p>
    </header>

    <main class="layout">
        <section class="card cube-card">
            <div id="cube-scene">
                <div id="cube-3d"></div>
            </div>

            <div class="paint">
                <h2>Paint</h2>
                <p class="hint">Pick a colour, then click a sticker. Drag the cube to rotate it.</p>
                <div id="palette" aria-label="Paint colour"></div>
            </div>
        </section>

        <div class="panels">
            <div id="error"></div>

            <section class="card">
                <h2>Cube</h2>
                <div class="row">
                    <button id="scramble-btn" type="button">Scramble</button>
                    <button id="reset-btn" type="button">Reset</button>
                </div>
                <p id="scramble-moves"></p>
            </section>

            <section class="card">
                <h2>Solve</h2>
                <div class="row">
                    <label for="method-select">Solver</label>
                    <select id="method-select"></select>
                    <button id="solve-btn" type="button">Solve</button>
                </div>
                <div class="row">
                    <label for="thinking-time">Thinking time</label>
                    <input id="thinking-time" type="range" min="0.1" max="5" step="0.1" value="1">
                    <output id="thinking-time-value" for="thinking-time">1.0 s</output>
                </div>
                <p id="solve-info"></p>
            </section>

            <section class="card">
                <h2>Solution</h2>
                <div id="solution"></div>
                <div class="row">
                    <button id="prev-btn" type="button">Previous</button>
                    <span id="step"></span>
                    <button id="next-btn" type="button">Next</button>
                </div>
                <div class="row">
                    <label for="turn-time">Turn time</label>
                    <input id="turn-time" type="range" min="0" max="1000" step="50" value="300">
                    <output id="turn-time-value" for="turn-time">300 ms</output>
                </div>
            </section>
        </div>
    </main>
    <script src="/static/app.js" defer></script>
</body>
</html>
