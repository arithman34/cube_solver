<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/static/style.css">
    <title>Cube Solver</title>
</head>
<body>
    <h1>Cube Solver</h1>
    <p>Scramble a cube or paint your own, then solve it.</p>

    <div class="layout">
        <div id="cube-scene">
            <div id="cube-3d"></div>
        </div>

        <div>
            <div>
                <button id="scramble-btn" type="button">Scramble</button>
                <label for="method-select">Solver</label>
                <select id="method-select"></select>
                <button id="solve-btn" type="button">Solve</button>
                <button id="reset-btn" type="button">Reset</button>            </div>
            <div id="palette" aria-label="Paint colour"></div>
            <p id="scramble-moves"></p>
            <div id="solution"></div>
            <div>
                <button id="prev-btn" type="button">Previous</button>
                <span id="step"></span>
                <button id="next-btn" type="button">Next</button>
            </div>
            <div>
                <label for="turn-time">Turn time</label>
                <input id="turn-time" type="range" min="0" max="1000" step="50" value="300">
                <output id="turn-time-value" for="turn-time">300 ms</output>
            </div>
            <p id="solve-info"></p>

            <div id="error"></div>
        </div>
    </div>
    <script src="/static/app.js" defer></script>
</body>
</html>
